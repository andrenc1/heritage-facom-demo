[WIKIDATA]
WIKIDATA_SPARQL_ENDPOINT = https://query.wikidata.org/sparql
; Troque pelo nome do seu projeto e um contato (e-mail). O Wikidata pede
; essa identificação de quem faz consultas automáticas.
CUSTOM_USER_AGENT = HeritageConnectorDemo (seu-contato-aqui)

[FUSEKI]
; "fuseki" é o nome do serviço no docker-compose.yml, não "localhost"
FUSEKI_ENDPOINT = http://fuseki:3030/heritage-connector/sparql

[ELASTIC]
ELASTIC_SEARCH_CLUSTER = http://elasticsearch:9200/
; sem segurança ligada no Elasticsearch de teste: usuário e senha são ignorados
ELASTIC_SEARCH_USER = elastic
ELASTIC_SEARCH_PASSWORD = qualquer-coisa
; índice só de teste: o facom_loader.py apaga e recria a cada execução
ELASTIC_SEARCH_INDEX = heritageconnector_test
ELASTIC_SEARCH_WIKI_INDEX = wikidump
ES_BULK_CHUNK_SIZE = 1000
ES_BULK_QUEUE_SIZE = 8

[DISAMBIGUATION]
PIDS_IGNORE = P2283 P27
PIDS_CATEGORICAL = P106
