# Nome próprio do projeto: os volumes não se misturam com os de outra instalação.
name: heritage-facom

services:
  # Guarda os registros do museu como documentos JSON e permite buscá-los.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Guarda os mesmos dados como grafo e responde consultas SPARQL.
  fuseki:
    image: stain/jena-fuseki
    environment:
      - ADMIN_PASSWORD=admin
      - FUSEKI_DATASET_1=heritage-connector
    ports:
      - "3030:3030"
    volumes:
      - fusekidata:/fuseki

  # Onde rodam os scripts. O framework já está dentro da imagem.
  app:
    build: .
    depends_on:
      elasticsearch:
        condition: service_healthy
      fuseki:
        condition: service_started
    volumes:
      # scripts e dados do museu (editar no VS Code vale na hora)
      - .:/work
      # config.ini e field_mapping.py, no lugar onde o framework os procura
      - ./config:/opt/heritage-connector/config:ro
    stdin_open: true
    tty: true

volumes:
  esdata:
  fusekidata:
